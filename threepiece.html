<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trendora BD | Three Piece</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f7f7f7;
}

header{
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
}

header h1{
  margin:0;
}

.products{
  max-width:1000px;
  margin:30px auto;
  padding:15px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 15px #ddd;
}

.card img{
  width:100%;
  height:400px;
  object-fit:cover;
  display:block;
}

.info{
  padding:18px;
}

.info h2{
  margin:0 0 8px;
}

.price{
  color:#e62e5b;
  font-size:24px;
  font-weight:bold;
  margin:12px 0;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
  font-size:17px;
  cursor:pointer;
}

@media(max-width:750px){
  .products{
    grid-template-columns:1fr;
  }

  .card img{
    height:480px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Trendora BD</h1>
  <p>✨ Three Piece Collection</p>
</header>

<div class="products">

  <!-- Product 1 -->
  <div class="card">
    <img src="threepiece1.jpeg" alt="Three Piece 1">

    <div class="info">
      <h2>Three Piece 1</h2>
      <p>সুন্দর ও আকর্ষণীয় থ্রীপিস।</p>

      <div class="price">৳900</div>

      <button onclick="order('Three Piece 1','900')">
        🛒 Order Now
      </button>
    </div>
  </div>


  <!-- Product 2 -->
  <div class="card">
    <img src="threepiece2.jpeg" alt="Three Piece 2">

    <div class="info">
      <h2>Three Piece 2</h2>
      <p>সুন্দর ও আকর্ষণীয় থ্রীপিস।</p>

      <div class="price">৳850</div>

      <button onclick="order('Three Piece 2','850')">
        🛒 Order Now
      </button>
    </div>
  </div>


  <!-- Product 3 -->
  <div class="card">
    <img src="threepiece3.jpeg" alt="Three Piece 3">

    <div class="info">
      <h2>Three Piece 3</h2>
      <p>সুন্দর ও আকর্ষণীয় থ্রীপিস।</p>

      <div class="price">৳800</div>

      <button onclick="order('Three Piece 3','800')">
        🛒 Order Now
      </button>
    </div>
  </div>

</div>


<script>

function order(product,price){

  let name = prompt("👤 আপনার নাম লিখুন:");

  if(!name){
    return;
  }

  let phone = prompt("📞 আপনার ফোন নম্বর লিখুন:");

  if(!phone){
    return;
  }

  let address = prompt("📍 আপনার সম্পূর্ণ ঠিকানা লিখুন:");

  if(!address){
    return;
  }

  let message =
`🛍️ নতুন অর্ডার

📦 প্রোডাক্ট: ${product}
💰 মূল্য: ৳${price}

👤 নাম: ${name}
📞 ফোন: ${phone}
📍 ঠিকানা: ${address}`;

  let whatsapp =
  "https://wa.me/8801707443977?text=" +
  encodeURIComponent(message);

  window.open(whatsapp,"_blank");
}

</script>

</body>
</html>
